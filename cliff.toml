# git-cliff configuration: CHANGELOG.md and GitHub release notes from Conventional Commits.
#
#   uvx git-cliff@2.14.2 --tag v0.2.0 -o CHANGELOG.md   # before tagging a release
#   uvx git-cliff@2.14.2 --latest --strip header         # notes of the newest tag
#
# See docs/releasing.md. Keep the pinned version in sync with .github/workflows/release.yml.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), versions follow
[Semantic Versioning](https://semver.org/spec/v2.0.0.html), and the entries are generated
from the [Conventional Commits](https://www.conventionalcommits.org/) history with
[git-cliff](https://git-cliff.org/) (`cliff.toml`, see `docs/releasing.md`).
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits | sort(attribute="scope") %}
- {% if commit.scope != "~general" %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message }}\
{% endfor %}
{% endfor %}
"""
footer = """
{%- macro remote_url() -%}
  https://github.com/kadirnar/voice-agent-next
{%- endmacro -%}
{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: \
{{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: \
{{ self::remote_url() }}/releases/tag/{{ release.version }}
{% endif -%}
{% else -%}
{% if release.previous.version -%}
[Unreleased]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...HEAD
{% else -%}
[Unreleased]: {{ self::remote_url() }}/commits/main
{% endif -%}
{% endif -%}
{% endfor -%}
"""
trim = false
# Issue / pull request references become links (the squash-merge titles carry both:
# "feat(x): ... (#25) (#117)" = issue #25, pull request #117).
postprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/kadirnar/voice-agent-next/issues/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# Normalize scope spellings used over time so related entries sort together.
commit_preprocessors = [
  { pattern = '^(\w+)\(transport\)', replace = "${1}(transports)" },
  { pattern = '^(\w+)\(tts,stt\)', replace = "${1}(stt,tts)" },
]
# The HTML comments order the groups (`striptags` removes them in the template). Within a
# group, entries are sorted by scope; unscoped ones get "~general" (sorted last, not shown).
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  # project-management notes (roadmap / wave progress), not changes to the package
  { message = "^docs.*roadmap", skip = true },
  { message = "^style", skip = true },
  { message = "^chore\\(deps", group = "<!-- 08 -->Dependencies", default_scope = "~general" },
  { message = "^feat", group = "<!-- 00 -->Features", default_scope = "~general" },
  { message = "^fix", group = "<!-- 01 -->Bug fixes", default_scope = "~general" },
  { message = "^perf", group = "<!-- 02 -->Performance", default_scope = "~general" },
  { message = "^refactor", group = "<!-- 03 -->Refactoring", default_scope = "~general" },
  { message = "^docs", group = "<!-- 04 -->Documentation", default_scope = "~general" },
  { message = "^test", group = "<!-- 05 -->Tests", default_scope = "~general" },
  { message = "^(build|ci)", group = "<!-- 06 -->Build and CI", default_scope = "~general" },
  { message = "^revert", group = "<!-- 09 -->Reverts", default_scope = "~general" },
  { message = "^chore", group = "<!-- 10 -->Miscellaneous", default_scope = "~general" },
]
