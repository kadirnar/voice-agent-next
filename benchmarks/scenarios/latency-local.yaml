# T1 latency with real speech rendered by a local TTS (Kokoro): the caller speaks with a
# male voice, so it can be told apart from the agent's default voice in the recording.
# Requires the `kokoro` extra (the model is downloaded once).
name: latency-local
version: 1
description: >-
  Short customer-service questions spoken by Kokoro (am_adam), for benchmarking engines
  with real STT / VAD models fully offline.
sample_rate: 16000
loudness_dbfs: -20.0
lead_in: 0.5
stimuli: tts
tts: {provider: kokoro/v1.0-fp16, voice: am_adam}
reply_timeout: 15.0
gap_after_reply: 0.5
turns:
  - {id: "time", text: "What time does the store open tomorrow?"}
  - {id: "table", text: "Can you book a table for two people tonight?"}
  - {id: "order", text: "Where is my order? I placed it last week."}
  - {id: "sunday", text: "Are you open on Sunday afternoon?"}
  - {id: "flight", text: "Please change my flight to Friday morning."}
  - {id: "refund", text: "How long does a refund usually take?"}
