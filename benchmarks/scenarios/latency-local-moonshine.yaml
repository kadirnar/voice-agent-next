# T1 latency of the fully local CPU cascade with Moonshine Streaming STT: the same stimuli
# as latency-local.yaml (same text, voice and pacing, so the numbers compare directly),
# for runs made back to back with faster-whisper `base` and Moonshine agent configs.
#
#   uv sync --extra local --extra moonshine --extra openai --extra bench
#   van bench latency -c agent-moonshine.yaml -s benchmarks/scenarios/latency-local-moonshine.yaml \
#       --turns 12 --sessions 2 --label moonshine-small
#   van bench latency -c agent-whisper.yaml -s benchmarks/scenarios/latency-local-moonshine.yaml \
#       --turns 12 --sessions 2 --label whisper-base
#
# agent-moonshine.yaml (agent-whisper.yaml is identical except for
# `stt: {provider: faster_whisper/base, language: en, device: cpu}`):
#
#   stt: {provider: moonshine/small-streaming, language: en}
#   llm: {provider: ollama/LiquidAI/lfm2.5-1.2b-instruct, temperature: 0}
#   tts: kokoro/v1.0-fp16
#   vad: silero
#   turn_detector: smart_turn
#   agent:
#     instructions: You are a helpful customer-service agent on a phone call. Answer in
#       two or three full sentences, in plain spoken English.
#
# See docs/providers/moonshine.md for the results.
name: latency-local-moonshine
version: 1
description: >-
  latency-local stimuli (Kokoro am_adam) for comparing the local CPU cascade with
  Moonshine Streaming and faster-whisper STT.
sample_rate: 16000
loudness_dbfs: -20.0
lead_in: 0.5
stimuli: tts
tts: {provider: kokoro/v1.0-fp16, voice: am_adam}
reply_timeout: 15.0
gap_after_reply: 0.5
turns:
  - {id: "time", text: "What time does the store open tomorrow?"}
  - {id: "table", text: "Can you book a table for two people tonight?"}
  - {id: "order", text: "Where is my order? I placed it last week."}
  - {id: "sunday", text: "Are you open on Sunday afternoon?"}
  - {id: "flight", text: "Please change my flight to Friday morning."}
  - {id: "refund", text: "How long does a refund usually take?"}
