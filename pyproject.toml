[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voice-agent-next"
version = "0.1.0.dev0"
description = "Real-time speech-to-speech voice agents: native S2S models and streaming cascades, local and cloud, on Linux, macOS and Windows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kadir Nar", email = "kadir.nar@hotmail.com" }]
keywords = [
  "voice-agent",
  "speech-to-speech",
  "realtime",
  "stt",
  "tts",
  "llm",
  "vad",
  "turn-detection",
  "webrtc",
  "benchmark",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "httpx>=0.27",
  "websockets>=13.0",
  "pyyaml>=6.0",
  "platformdirs>=4.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
# --- audio / runtime ---------------------------------------------------------
resample = ["soxr>=0.5"]
audio = ["sounddevice>=0.5", "soxr>=0.5"]
aec = ["livekit>=1.0"]
onnx = ["onnxruntime>=1.19"]
# --- GPU runtime libraries (see docs/hardware.md) ---------------------------------
# cuBLAS 12 for CTranslate2 4.x (faster-whisper on NVIDIA GPUs; 12.8+ has Blackwell
# kernels). voice_agent_next.hardware loads it from site-packages: no LD_LIBRARY_PATH.
# ONNX Runtime models need `onnxruntime-gpu` in place of `onnxruntime` instead.
cuda = [
  "nvidia-cublas-cu12>=12.8; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
# --- VAD / turn detection (local) ----------------------------------------------
silero = ["onnxruntime>=1.19"]
smart-turn = ["onnxruntime>=1.19"]
# --- local STT / TTS / LLM ------------------------------------------------------
faster-whisper = ["faster-whisper>=1.1"]
kokoro = ["kokoro-onnx>=0.6.1; python_version < '3.14'"]  # upstream caps Requires-Python <3.14
# moonshine-voice ships py3-none wheels only for these platforms (no sdist)
moonshine = [
  "moonshine-voice>=0.1.5; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
# Local GPU TTS (#79). Each pulls CUDA PyTorch (Linux: PyPI's CUDA build; Windows: the
# PyTorch cu130 index, see [tool.uv.sources]) and pins its own transformers, so these extras
# conflict with each other and with `pocket-tts` (CPU torch): install one at a time.
# chatterbox-tts 0.1.7 pins torch==2.6.0 (no Blackwell kernels): see
# [[tool.uv.dependency-metadata]] below and docs/providers/chatterbox.md.
chatterbox = [
  "chatterbox-tts>=0.1.7; python_version < '3.15' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
  "torch>=2.6; python_version < '3.15' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
  "torchaudio>=2.6; python_version < '3.15' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
]
# CPU-only torch (see [tool.uv.sources]); no torch wheels for Intel macOS since torch 2.3
pocket-tts = [
  "pocket-tts>=3.3,<4; python_version < '3.15' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
  "torch>=2.5; python_version < '3.15' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
]
# sherpa-onnx wheels (except Linux armv7l, which bundles it) depend on sherpa-onnx-core of the
# same version, which uv's universal lock misses: it reads the armv7l metadata. Upgrade both.
# 1.13.3 (2026-06) postdates every model in the catalog (Nemotron 3.5 streaming, 2026-06-11).
qwen-tts = [
  "qwen-tts>=0.1.1; python_version < '3.15' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
  "torch>=2.7; python_version < '3.15' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
  "torchaudio>=2.7; python_version < '3.15' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
]
sherpa-onnx = [
  "sherpa-onnx>=1.13.3",
  "sherpa-onnx-core>=1.13.3; platform_machine != 'armv7l'",
]
# --- cloud providers (Deepgram, Cartesia, AssemblyAI, ElevenLabs... use raw WS/HTTP) --
anthropic = ["anthropic>=0.60"]
google = ["google-genai>=2.25"]
openai = ["openai>=2.0"]
# --- transports -------------------------------------------------------------------
webrtc = ["aiortc>=1.9"]
# --- observability -----------------------------------------------------------------
otel = ["opentelemetry-api>=1.27"]  # tracing API only: pick your own SDK and exporter
# --- benchmark ----------------------------------------------------------------------
bench = ["jiwer>=3.0"]
# --- bundles ------------------------------------------------------------------------
local = ["voice-agent-next[audio,silero,smart-turn,faster-whisper,kokoro]"]
cloud = ["voice-agent-next[openai,anthropic,google]"]

[project.scripts]
van = "voice_agent_next.cli.main:main"
voice-agent-next = "voice_agent_next.cli.main:main"

[project.urls]
Homepage = "https://github.com/kadirnar/voice-agent-next"
Repository = "https://github.com/kadirnar/voice-agent-next"
Issues = "https://github.com/kadirnar/voice-agent-next/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "soxr>=0.5",
  "opentelemetry-api>=1.27",  # tracing tests (in-memory span exporter)
  "opentelemetry-sdk>=1.27",
]

[tool.uv]
# The GPU TTS extras need CUDA torch and pin different transformers versions; pocket-tts
# needs CPU torch. uv resolves each of them in its own fork of the lockfile.
conflicts = [
  [{ extra = "pocket-tts" }, { extra = "chatterbox" }],
  [{ extra = "pocket-tts" }, { extra = "qwen-tts" }],
  [{ extra = "chatterbox" }, { extra = "qwen-tts" }],
]

# chatterbox-tts 0.1.7 pins torch==2.6.0 (no kernels for Blackwell GPUs, RTX 50xx), numpy<2
# on Python < 3.13 (conflicts with kokoro-onnx) and gradio (its demo, unused by the library).
# This is its dependency list with those pins relaxed, for uv's resolution only; pip users
# see docs/providers/chatterbox.md.
[[tool.uv.dependency-metadata]]
name = "chatterbox-tts"
version = "0.1.7"
requires-dist = [
  "numpy>=1.24.0",
  "librosa==0.11.0",
  "s3tokenizer",
  "torch>=2.7",
  "torchaudio>=2.7",
  "transformers==5.2.0",
  "diffusers==0.29.0",
  "resemble-perth>=1.0.0",
  "conformer==0.3.2",
  "safetensors==0.5.3",
  "spacy-pkuseg",
  "pykakasi==2.3.0",
  "pyloudnorm",
  "omegaconf",
]

# qwen-tts 0.1.1 without gradio (its web demo, unused by the library).
[[tool.uv.dependency-metadata]]
name = "qwen-tts"
version = "0.1.1"
requires-dist = [
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "librosa",
  "torchaudio",
  "soundfile",
  "sox",
  "onnxruntime",
  "einops",
]

[tool.uv.sources]
# pocket-tts, Linux/Windows: CPU wheels (~200 MB) instead of the multi-GB CUDA build; macOS
# wheels on PyPI are CPU/MPS already. GPU extras: PyPI's Linux wheels are CUDA builds; on
# Windows PyPI only has CPU wheels, so they come from the PyTorch CUDA 13.0 index.
torch = [
  { index = "pytorch-cpu", extra = "pocket-tts", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu130", extra = "chatterbox", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu130", extra = "qwen-tts", marker = "sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu130", extra = "chatterbox", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu130", extra = "qwen-tts", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent_next"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

# --- tooling ----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".claude"]  # agent worktrees live here

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "C4", "PT"]
ignore = [
  "RUF001", # ambiguous unicode (we handle multilingual punctuation)
  "RUF002",
  "RUF003",
  "RUF012", # mutable class defaults are fine for ClassVar metadata
  "B027",   # empty methods in ABCs are intentional hooks
  "SIM105", # contextlib.suppress is not always clearer
  "ASYNC109", # explicit `timeout` params are part of our public API
  "PT011",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT018", "E501", "ASYNC110"]
"benchmarks/**" = ["E501"]
"examples/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["voice_agent_next"]

[tool.mypy]
python_version = "3.12"  # numpy stubs use 3.12 syntax; 3.11 runtime is covered by CI
packages = ["voice_agent_next"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
addopts = "-ra -m 'not integration and not model and not audio_device'"
markers = [
  "integration: talks to a real cloud API (needs API keys / network)",
  "model: downloads or loads real ML models (slow, large)",
  "audio_device: needs real audio input/output hardware",
  "slow: slow test",
]
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]

[tool.coverage.run]
source = ["voice_agent_next"]
branch = true
