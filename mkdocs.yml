      - 4 · Turn-taking, VAD, interruptions: research/04-turn-taking-vad-interruptions.md
      - 5 · Latency, transports, production: research/05-latency-transports-production.md
      - 6 · Evaluation and benchmarks: research/06-evaluation-and-benchmarks.md
  - API reference:
