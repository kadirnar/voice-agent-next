          - Anthropic: providers/anthropic.md
          - Google Gemini: providers/google.md
          - OpenAI-compatible LLMs: providers/openai-compatible.md
          - Deepgram: providers/deepgram.md
          - AssemblyAI: providers/assemblyai.md
          - Cartesia: providers/cartesia.md
          - ElevenLabs: providers/elevenlabs.md
      - Local:
          - sherpa-onnx: providers/sherpa-onnx.md
          - Moonshine: providers/moonshine.md
          - faster-whisper: providers/faster_whisper.md
          - Kokoro: providers/kokoro.md
          - Pocket TTS: providers/pocket-tts.md
          - Silero VAD: providers/silero.md
          - Smart Turn: providers/smart_turn.md
  - Transports:
