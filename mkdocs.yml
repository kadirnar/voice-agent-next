# Documentation site: `uv sync --group docs && uv run mkdocs serve`
# CI (.github/workflows/docs.yml) builds with `mkdocs build --strict`: broken links fail it.
site_name: voice-agent-next
site_description: >-
  Real-time speech-to-speech voice agents in Python: native S2S models and streaming
  cascades, local and cloud, on Linux, macOS and Windows, with a built-in benchmark suite.
site_url: https://kadirnar.github.io/voice-agent-next/
repo_url: https://github.com/kadirnar/voice-agent-next
repo_name: kadirnar/voice-agent-next
edit_uri: edit/main/docs/
copyright: Copyright &copy; Kadir Nar — Apache-2.0

exclude_docs: |
  hooks/

hooks:
  - docs/hooks/generated.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            extensions:
              - docs/hooks/griffe_rst.py:RstToMarkdown
            docstring_style: google
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            group_by_category: true
            filters: ["!^_"]
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            summary: true
            show_if_no_docstring: false

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your first agent: getting-started/first-agent.md
      - Presets: presets.md
