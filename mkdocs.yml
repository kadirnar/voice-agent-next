      - Local audio: transports/local.md
      - WebSocket: transports/websocket.md
  - Deploy:
      - deploy/index.md
      - Realtime server: deploy/realtime-server.md
      - Serving (van serve): deploy/serving.md
      - Telephony: transports/telephony.md
      - WebRTC: transports/webrtc.md
  - Benchmarks:
      - Methodology: benchmarks/methodology.md
      - Results: benchmarks/results.md
  - Operations:
      - Hardware: hardware.md
      - Models: models.md
  - Research:
