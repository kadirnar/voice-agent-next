# Browser demos of docker/compose.yaml on one origin (http://localhost:8080):
#   /websocket/  examples/web/index.html     -> /ws/        -> agent-ws:8765 (van-ws/1)
#   /webrtc/     examples/webrtc/index.html  -> /webrtc/... -> agent-webrtc:8080 (offer, config)
# Browsers allow the microphone on http://localhost (and https:// pages) only.
# /ws/health, /ws/ready, /ws/metrics and the same under /webrtc/ reach the agents' ops routes.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Relative Location headers: correct behind any published port or proxy.
    absolute_redirect off;

    # Docker's DNS, resolved per request: agents may restart (and change address) at any time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agent_ws http://agent-ws:8765;
    set $agent_webrtc http://agent-webrtc:8080;

    location = / {
        return 302 /websocket/;
    }

    # The pages take the agent's address from the query string (?ws=... / ?server=...).
    location = /websocket/ {
        if ($arg_ws = "") {
            return 302 /websocket/?ws=ws://$http_host/ws/;
        }
        try_files /websocket/index.html =404;
    }

    location = /webrtc/ {
        if ($arg_server = "") {
            return 302 /webrtc/?server=$scheme://$http_host/webrtc/;
        }
        try_files /webrtc/index.html =404;
    }

    location /ws/ {
        rewrite ^/ws(/.*)$ $1 break;
        proxy_pass $agent_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/webrtc/(config|offer|health|ready|metrics)$ {
        rewrite ^/webrtc(/.*)$ $1 break;
        proxy_pass $agent_webrtc;
        proxy_set_header Host $host;
    }
}
