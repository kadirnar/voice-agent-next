name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly full matrix (Mondays 03:17 UTC)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "0"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test-linux:
    name: test (ubuntu, py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest -q
      - name: providers import without optional dependencies
        run: uv run van providers --json > /dev/null
      - name: echo cancellation with the native livekit wheel (extra `aec`)
        run: uv run --extra aec pytest -q -m model tests/test_aec.py

  # Provider tests that need optional SDKs (anthropic, openai, onnxruntime, faster-whisper,
  # livekit, ...) are skipped by the jobs above; this job installs every extra.
  test-extras:
    name: test (ubuntu, py3.12, all extras)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: System audio library (sounddevice)
        run: sudo apt-get update -q && sudo apt-get install -y -q libportaudio2
      # `cuda` is ~700 MB of NVIDIA runtime wheels, useless on a GPU-less runner
      # The GPU TTS extras (chatterbox, qwen-tts) are multi-GB CUDA torch installs and conflict
      # with pocket-tts (CPU torch); their unit tests use fake modules.
      - run: uv sync --all-extras --no-extra cuda --no-extra chatterbox --no-extra qwen-tts
      - run: uv run pytest -q
      - run: uv run van providers --json > /dev/null

  # Windows runs on every pull request: asyncio networking (Proactor loop, TCP connect
  # behaviour, timer resolution) differs most there. Its minutes cost 2x on private repos.
  test-windows:
    name: test (windows-latest, py3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run van providers --json
      - name: echo cancellation with the native livekit wheel (extra `aec`)
        run: uv run --extra aec pytest -q -m model tests/test_aec.py
      - name: WebRTC transport with aiortc (extra `webrtc`)
        run: uv run --extra webrtc pytest -q tests/test_webrtc_transport.py

  # T7 framework-overhead smoke tier (~2 min, offline, mocks) compared with the committed
  # baseline, which has one entry per runner OS (benchmarks/baselines/overhead-ci.json).
  # It fails only on overhead regressions > 50 % and > 5 ms (20 ms on Windows), loop-lag
  # and flush regressions > 50 % and > 5 ms (loop lag: 10 ms on Windows), latency
  # regressions > 10 % and > 30 ms (all with non-overlapping CIs), playout gaps > 20 ms or
  # hot paths more than 3x slower, and only if a re-run of the failing section confirms
  # it. The job summary shows the comparison. Refresh the baseline from the
  # `bench-overhead-<OS>` artifact (see benchmarks/README.md).
  bench-overhead:
    name: bench overhead gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      COLUMNS: "160" # wide enough for the result tables in the log
      PYTHONUTF8: "1" # the tables use −, µ and · (the Windows console defaults to cp1252)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - name: T7 overhead smoke tier vs baseline
        shell: bash
        run: >-
          uv run van bench overhead --tier smoke
          --baseline benchmarks/baselines/overhead-ci.json --retries 1
          --out bench-results --run-id "overhead-${{ runner.os }}"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-overhead-${{ runner.os }}
          path: bench-results/
          if-no-files-found: ignore
          retention-days: 30

  # macOS minutes cost 10x on private repos: run on main, weekly, manually, or on pull
  # requests labelled `ci:full`.
  test-macos:
    name: test (macos-latest, py3.12)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run van providers --json
      - name: echo cancellation with the native livekit wheel (extra `aec`)
        run: uv run --extra aec pytest -q -m model tests/test_aec.py
      - name: WebRTC transport with aiortc (extra `webrtc`)
        run: uv run --extra webrtc pytest -q tests/test_webrtc_transport.py
