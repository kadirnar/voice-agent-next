name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly full matrix (Mondays 03:17 UTC)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "0"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test-linux:
    name: test (ubuntu, py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest -q
      - name: providers import without optional dependencies
        run: uv run van providers --json > /dev/null
      - name: echo cancellation with the native livekit wheel (extra `aec`)
        run: uv run --extra aec pytest -q -m model tests/test_aec.py

  # macOS / Windows minutes are expensive on private repos: run them on main, weekly,
  # manually, or on pull requests labelled `ci:full`.
  test-cross-platform:
    name: test (${{ matrix.os }}, py3.12)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run van providers --json
      - name: echo cancellation with the native livekit wheel (extra `aec`)
        run: uv run --extra aec pytest -q -m model tests/test_aec.py
