name: model tests

# Real-model tests (`pytest -m model`) on all three OSes: native wheels (onnxruntime,
# ctranslate2, kokoro-onnx, livekit APM), model downloads and pinned checksums are exactly
# what breaks silently between releases. Weekly, on demand, and on PRs labelled `ci:models`.
on:
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      mlx-large:
        description: "MLX job: also run the opt-in larger models (Parakeet 110M, Kokoro, mlx-lm with Qwen3 0.6B; ~1.2 GB more)"
        type: boolean
        default: false
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  models:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:models')
    name: models (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      # short paths: espeak-ng data inside the Kokoro cache hits MAX_PATH on Windows otherwise
      # (the runner context is not available in job-level env)
      - name: model cache locations
        shell: bash
        run: |
          echo "VAN_CACHE_DIR=${RUNNER_TEMP}/van" >> "$GITHUB_ENV"
          echo "HF_HOME=${RUNNER_TEMP}/hf" >> "$GITHUB_ENV"
          echo "MOONSHINE_VOICE_CACHE=${RUNNER_TEMP}/moonshine" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: model cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/van
            ${{ runner.temp }}/hf
            ${{ runner.temp }}/moonshine
          key: models-${{ runner.os }}-${{ hashFiles('src/voice_agent_next/providers/**/*.py', 'tests/providers/**/*.py', 'tests/test_aec.py') }}
          restore-keys: models-${{ runner.os }}-
      - run: uv sync --extra silero --extra smart-turn --extra faster-whisper --extra kokoro --extra aec --extra moonshine
      - run: uv run pytest -q -m model --durations=15

  # MLX providers (extras `mlx`, `mlx-whisper`) on an Apple silicon runner: Whisper tiny
  # (74 MB) and Pocket TTS (240 MB) always; the larger models on a manual run with
  # `mlx-large` (see tests/providers/test_mlx_models.py).
  mlx:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:models')
    name: models (macos-latest, MLX)
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      VAN_TEST_MLX_PARAKEET: ${{ inputs.mlx-large && 'parakeet-tdt_ctc-110m' || '' }}
      VAN_TEST_MLX_KOKORO: ${{ inputs.mlx-large && '1' || '' }}
      VAN_TEST_MLX_LM_MODEL: ${{ inputs.mlx-large && 'mlx-community/Qwen3-0.6B-4bit' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: model cache locations
        shell: bash
        run: |
          echo "VAN_CACHE_DIR=${RUNNER_TEMP}/van" >> "$GITHUB_ENV"
          echo "HF_HOME=${RUNNER_TEMP}/hf" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: model cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/van
            ${{ runner.temp }}/hf
          key: models-mlx-${{ inputs.mlx-large && 'large' || 'small' }}-${{ hashFiles('tests/providers/test_mlx_models.py') }}
          restore-keys: models-mlx-${{ inputs.mlx-large && 'large' || 'small' }}-
      - run: uv sync --extra mlx --extra mlx-whisper
      - run: uv run van providers --json > /dev/null
      - run: uv run pytest -s -q -m model tests/providers/test_mlx_models.py --durations=10
